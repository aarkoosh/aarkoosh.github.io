<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Arkoosh — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Schibsted+Grotesk:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand-lockup">
          <a class="brand" href="#portfolio">
            <span class="mark" aria-hidden="true"><i></i><i></i></span>
            <span class="brand-name">Alex Arkoosh</span>
          </a>
          <span class="section-label">Portfolio</span>
        </div>
        <nav aria-label="Contact">
          <a href="https://www.linkedin.com/in/aarkoosh" target="_blank" rel="noopener">LinkedIn</a>
          <a class="pill" href="https://www.linkedin.com/in/aarkoosh" target="_blank" rel="noopener">
            <span class="orb" aria-hidden="true"></span>
            Open to work
          </a>
        </nav>
      </header>
      <div class="stage">
        <div class="rail">
          <div class="depts" id="depts" role="navigation" aria-label="Portfolio sections"></div>
        </div>
        <section class="panel" id="portfolio" aria-labelledby="panel-title">
          <div class="panel-head">
            <div class="panel-title-row">
              <h1 id="panel-title">Portfolio</h1>
              <label class="search">
                <span class="sr-only">Search portfolio</span>
                <input id="search" type="search" placeholder="Search…" autocomplete="off">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <circle cx="8.5" cy="8.5" r="5.25" fill="none" stroke="currentColor" stroke-width="1.4"></circle>
                  <path d="M12.5 12.5 16.5 16.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
                </svg>
              </label>
            </div>
            <label class="kind">
              <span class="sr-only">Filter by kind</span>
              <select id="kind">
                <option value="all">All kinds</option>
                <option value="Project">Projects</option>
                <option value="Process">Process</option>
                <option value="Skill">Skills</option>
                <option value="Tool">Tools</option>
              </select>
            </label>
          </div>
          <div class="panel-scroll" id="list" tabindex="0"></div>
          <p id="status" class="sr-only" aria-live="polite"></p>
        </section>
      </div>
    </div>
  </body>
</html>
